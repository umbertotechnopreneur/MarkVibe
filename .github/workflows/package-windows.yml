name: Package MarkVibe for Windows
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release
        required: true
      version:
        description: Four-part version greater than packaging/windows/version.json
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: windows-packages
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Package x64 and ARM64; no tests or installation
        env:
          MARKVIBE_CONFIGURATION: ${{ inputs.configuration }}
          MARKVIBE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-windows.ps1 -Configuration $env:MARKVIBE_CONFIGURATION -Version $env:MARKVIBE_VERSION
      - name: Upload distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MarkVibe-${{ inputs.version }}-${{ inputs.configuration }}-Windows
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
