<html lang="en" data-theme="light" data-document-style="technical">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="color-scheme" content="light dark">
 <meta name="description" content="Read Markdown, explore its source and discover how your documentation connects. Documents are processed on your device.">
 <title>MarkVibe · Markdown viewer</title>
 <base href="./">
 <link rel="icon" type="image/svg+xml" href="favicon.svg">
 <link rel="stylesheet" href="css/shell.css">
 <link rel="stylesheet" href="js/markvibe.css">
</head>
<body>
 <div id="app"></div>
 <div id="startup">
  <div class="boot-card">
   <span class="boot-mark" aria-hidden="true">M</span>
   <h1 data-mv-i18n="A little space to read.">A little space to read.</h1>
   <p id="boot-message" role="status" aria-live="polite"
      data-mv-i18n="Preparing your workspace…">Preparing your workspace…</p>
   <div class="boot-progress"></div>
   <button id="startup-continue" type="button" hidden
           data-mv-i18n="Open workspace">Open workspace</button>
   <dl id="startup-build" class="boot-build" hidden>
    <div><dt data-mv-i18n="Version">Version</dt><dd id="startup-build-version"></dd></div>
    <div><dt data-mv-i18n="Build machine">Build machine</dt><dd id="startup-build-machine"></dd></div>
    <div><dt data-mv-i18n="Built">Built</dt><dd id="startup-build-time"></dd></div>
   </dl>
  </div>
 </div>
 <main id="opensilver-root" aria-label="MarkVibe Markdown viewer"></main>
 <div id="blazor-error-ui" role="alert"><span data-mv-i18n="Something interrupted this session.">Something interrupted this session.</span> <a href="index.html" data-mv-i18n="Reload the viewer" title="Reload the viewer">Reload the viewer</a></div>
 <noscript>Enable JavaScript to read Markdown in this viewer.</noscript>
 <script type="module" src="bootstrap.js"></script>
</body>
</html>
